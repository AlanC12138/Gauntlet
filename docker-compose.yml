# Local development dependencies. Postgres holds the app database and the
# append-only price cache; Redis backs the RQ job queue.
#
# Ports are non-default on purpose — 5433 and 6380 rather than 5432 and 6379 —
# so this does not collide with a Postgres or Redis already running on the
# machine for something else.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: gauntlet
      POSTGRES_PASSWORD: gauntlet
      POSTGRES_DB: gauntlet
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # Depending services wait on this rather than on the container merely
      # existing — Postgres accepts connections several seconds after start.
      test: ["CMD-SHELL", "pg_isready -U gauntlet -d gauntlet"]
      interval: 2s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres_data:
