[tool.poetry]
name = "gauntlet"
version = "0.1.0"
description = "Multi-agent portfolio construction: propose, then verify by execution."
authors = ["Ying Lun Chen <alanchen0705@gmail.com>"]
readme = "README.md"
packages = [{ include = "gauntlet", from = "src" }]

[tool.poetry.dependencies]
# Versions below are the ones this was actually built and tested against.
python = "^3.13"
anthropic = "^0.120"
pandas = "^3.0"
numpy = "^2.5"
yfinance = "^1.5"
pyarrow = "^25.0"
pydantic = "^2.13"
pydantic-settings = "^2.14"
fastapi = "^0.165"
uvicorn = { extras = ["standard"], version = "^0.54" }
typer = "^0.29"
sqlalchemy = "^2.0"
alembic = "^1.19"
psycopg = {version = "^3.3", extras = ["binary"]}
redis = "^8.1"
rq = "^2.10"
clerk-backend-api = "^6.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
ruff = "^0.17"
fakeredis = "^2.37"

[tool.poetry.scripts]
gauntlet = "gauntlet.cli:app"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.pytest.ini_options]
testpaths = ["tests"]
